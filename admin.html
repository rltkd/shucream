<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>슈크림 통계 관리자</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #fff8ef;
      color: #3b2a1a;
    }

    .admin-wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      margin-bottom: 24px;
      color: #6b5a48;
    }

    .control-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d8b98c;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #c9893d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .summary {
      padding: 16px;
      background: white;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stats-row {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stats-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .stats-bar {
      height: 16px;
      background: #f1e0ca;
      border-radius: 999px;
      overflow: hidden;
    }

    .stats-bar-fill {
      height: 100%;
      background: #d89b56;
      border-radius: 999px;
    }

    .small {
      margin-top: 6px;
      font-size: 14px;
      color: #7a6a58;
    }
  </style>
</head>
<body>
  <main class="admin-wrap">
    <h1>슈크림 통계 관리자</h1>
    <p class="description">라운드별 참여 결과를 확인하는 개인용 페이지입니다.</p>

    <div class="control-box">
      <input id="roundInput" value="real_8" />
      <button id="loadButton">조회</button>
    </div>

    <div class="summary">
      <h2 id="statsTotal">총 0개의 결과</h2>
      <p id="roundText" class="small">현재 조회 라운드: real_8</p>
    </div>

    <div id="statsList"></div>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
